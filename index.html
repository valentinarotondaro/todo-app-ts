<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinTask – Todo App</title>
  </head>
  <body>
    <div class="container">
      <h1>Todo App</h1>
      <form class="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new todo" />
        <input type="date" id="due-date-input" />
        <select id="category-input" aria-label="Category">
  <option value="work">Work</option>
  <option value="personal" selected>Personal</option>
  <option value="study">Study</option>
  <option value="home">Home</option>
</select>
        <select id="priority-input" aria-label="Priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <p id="error-message">Please enter a todo item</p>
      <div id="category-filter" class="category-filter"></div>
      <ul class="todo-list" id="todo-list"></ul>

      <input type="color" id="colorPicker" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
